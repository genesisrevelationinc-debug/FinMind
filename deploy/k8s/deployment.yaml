apiVersion: apps/v1
kind: Deployment
metadata:
  name: finmind-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: finmind-backend
  template:
    metadata:
      labels:
        app: finmind-backend
    spec:
      containers:
      - name: finmind-backend
        image: finmind-backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_ENV
          value: "production"
        - name: DATABASE_URL
          value: "postgresql://user:password@finmind-db:5432/finmind"
        - name: REDIS_URL
          value: "redis://finmind-redis:6379/0"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"