apiVersion: apps/v1
kind: Deployment
metadata:
  name: finmind-backend
  namespace: finmind
spec:
  replicas: 3
  selector:
    matchLabels:
      app: finmind-backend
  template:
    metadata:
      labels:
        app: finmind-backend
    spec:
      containers:
        - name: finmind-backend
          image: finmind-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: FLASK_APP
              value: app
            - name: FLASK_ENV
              value: production
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finmind-frontend
  namespace: finmind
spec:
  replicas: 3
  selector:
    matchLabels:
      app: finmind-frontend
  template:
    metadata:
      labels:
        app: finmind-frontend
    spec:
      containers:
        - name: finmind-frontend
          image: finmind-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: REACT_APP_API_URL
              value: http://finmind-backend:8000
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"