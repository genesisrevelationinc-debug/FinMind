apiVersion: apps/v1
kind: Deployment
metadata:
  name: finmind-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: finmind-backend
  template:
    metadata:
      labels:
        app: finmind-backend
    spec:
      containers:
      - name: finmind-backend
        image: finmind-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: FLASK_APP
          value: app
        - name: FLASK_ENV
          value: production
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: finmind-secrets
              key: db_url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: finmind-secrets
              key: redis_url
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"