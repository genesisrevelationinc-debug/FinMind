version: '3.8'

services:
  web:
    build: ../
    command: gunicorn -w 4 -b 0.0.0.0:5000 app:app
    volumes:
      - ../:/app
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app/__init__.py
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://user:password@db/finmind
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: finmind

  redis:
    image: redis:6