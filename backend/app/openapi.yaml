openapi: 3.0.0
info:
  title: FinMind API
  version: 1.0.0
paths:
  /multi-account/overview:
    get:
      summary: Get multi-account financial overview
      description: Retrieve an overview of all financial accounts for the authenticated user.
      tags:
        - Multi-Account
      security:
        - BearerAuth: []
      responses:
        '200':
          description: A JSON array of account overviews
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    account_id:
                      type: integer
                    balance:
                      type: number
                    currency:
                      type: string
                    transactions:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                          amount:
                            type: number
                          description:
                            type: string
                          date:
                            type: string
                            format: date-time
        '404':
          description: User not found
securitySchemes:
  BearerAuth:
    type: http
    scheme: bearer
    bearerFormat: JWT