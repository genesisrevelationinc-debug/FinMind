openapi: 3.0.0
info:
  title: FinMind API
  version: 1.0.0
paths:
  /api/auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: User registered successfully
  /api/auth/login:
    post:
      summary: Login a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: User logged in successfully
  /api/dashboard/overview:
    get:
      summary: Get financial overview
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Financial overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: string
                  total_expenses:
                    type: number
                  total_bills:
                    type: number
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        expenses:
                          type: number
                        bills:
                          type: number
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT