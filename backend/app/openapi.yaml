openapi: 3.0.0
info:
  title: FinMind API
  version: 1.0.0
paths:
  /api/auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: User registered successfully
  /api/dashboard/overview:
    get:
      summary: Get financial overview for the user
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: month
          schema:
            type: string
          description: Month for which to get the summary (format: yyyy-mm)
      responses:
        '200':
          description: Financial overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  monthly_summary:
                    type: object
                  upcoming_bills:
                    type: array
                    items:
                      type: object
securitySchemes:
  BearerAuth:
    type: http
    scheme: bearer
    bearerFormat: JWT