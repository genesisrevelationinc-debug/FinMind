openapi: 3.0.0
info:
  title: FinMind API
  version: 1.0.0
paths:
  /api/dashboard/overview:
    get:
      summary: Get financial overview for a user
      parameters:
        - in: query
          name: user_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A JSON object containing the financial overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                  total_expenses:
                    type: number
                  total_bills:
                    type: number
                  expenses:
                    type: array
                    items:
                      type: object
                  bills:
                    type: array
                    items:
                      type: object